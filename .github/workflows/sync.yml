name: Sync Detections to Vega

# Runs on push to main: reconciles every detection YAML against the tenant.
# The reconciler skips no-op updates (it diffs the YAML against the current
# Vega state and only sends changes) and batches createDetections /
# updateDetections in chunks of 100. The API returns a per-detection result
# array, so a typo in one rule does not block others in the same batch.

on:
  push:
    branches: [main]
    paths:
      - 'detections/**'
      - 'scripts/**'
      - '.github/workflows/sync.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print plan without applying)'
        type: boolean
        default: false
      no_deletes:
        description: 'Skip the delete step (safe first-run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vega-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VEGA_ACCESS_KEY is set
        env:
          VEGA_ACCESS_KEY: ${{ secrets.VEGA_ACCESS_KEY }}
        run: |
          if [ -z "$VEGA_ACCESS_KEY" ]; then
            echo "::error::VEGA_ACCESS_KEY repository secret is not set."
            echo "::error::Configure it under Settings -> Secrets and variables -> Actions."
            echo "::error::See README 'First-time setup' for instructions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync to Vega
        env:
          VEGA_ACCESS_KEY: ${{ secrets.VEGA_ACCESS_KEY }}
          VEGA_TENANT_URL: ${{ vars.VEGA_TENANT_URL || 'https://app.vega.io' }}
        run: |
          python -m scripts.sync \
            --detections-dir ./detections \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.no_deletes && '--no-deletes' || '' }}
