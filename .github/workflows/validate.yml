name: Validate Detection PR

# Runs on every PR that touches detections/.
# Schema validation runs on every changed YAML. KQL is validated server-side
# at sync time, not here, so this workflow does not need a tenant secret and
# also runs cleanly on PRs opened from forks.

on:
  pull_request:
    branches: [main]
    paths:
      - 'detections/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to diff vs base

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate changed YAMLs
        run: |
          python -m scripts.pr_validate \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --detections-dir ./detections
