name: Validate PR

# Runs on every PR that touches detections/, skills/ or memories/.
# Schema validation runs on every changed YAML and SKILL.md. KQL is validated server-side
# at sync time, not here, so this workflow does not need a tenant secret and
# also runs cleanly on PRs opened from forks.

on:
  pull_request:
    branches: [main]
    paths:
      - 'detections/**'
      - 'skills/**'
      - 'memories/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full history to diff vs base

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate changed files
        run: |
          python -m scripts.pr_validate \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --detections-dir ./detections \
            --skills-dir ./skills \
            --memories-dir ./memories

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the sync engine tests
        run: python -m pytest -q tests
