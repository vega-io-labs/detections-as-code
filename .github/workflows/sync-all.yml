name: Sync ALL detections (manual)

# Manually-triggered re-sync of every detection YAML against the tenant.
# Useful for:
#   - First-time setup, to bulk-deploy your repo's detections to a tenant
#   - Recovery after a partial sync failure
#   - Reconciling drift after out-of-band UI edits
#
# Same workflow as sync.yml, but never tied to a push event. Defaults to
# --no-deletes to make first-run safer (a tenant with existing detections
# will not get them wiped).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print plan without applying)'
        type: boolean
        default: true
      no_deletes:
        description: 'Skip the delete step'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vega-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VEGA_ACCESS_KEY is set
        env:
          VEGA_ACCESS_KEY: ${{ secrets.VEGA_ACCESS_KEY }}
        run: |
          if [ -z "$VEGA_ACCESS_KEY" ]; then
            echo "::error::VEGA_ACCESS_KEY repository secret is not set."
            echo "::error::Configure it under Settings -> Secrets and variables -> Actions."
            echo "::error::See README 'First-time setup' for instructions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync to Vega
        env:
          VEGA_ACCESS_KEY: ${{ secrets.VEGA_ACCESS_KEY }}
          VEGA_TENANT_URL: ${{ vars.VEGA_TENANT_URL || 'https://app.vega.io' }}
        run: |
          python -m scripts.sync \
            --detections-dir ./detections \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.no_deletes && '--no-deletes' || '' }}
