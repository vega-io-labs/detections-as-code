id: "019e1714-dcec-7067-aa94-cdb32c27e55d"
name: "Mimikatz Credential Theft - Multi-Signal (CrowdStrike)"
severity: 4
state: "test_mode"
frequencyCron: "15m"
lookBackSeconds: 900
mitreTechniques:
  - "T1003.001"
  - "T1003.002"
  - "T1003.006"
logicDescription: "Matches CrowdStrike-Events with Mimikatz command-line signatures (sekurlsa::pth, lsadump::dcsync, lsadump::sam, lsadump::secrets) where process integrity is System / High / Elevated and the actor user is a service or machine account (name ending in $, or SYSTEM / LOCAL SERVICE / NETWORK SERVICE)."
attackScenario: "An adversary runs Mimikatz on a Windows host from an elevated service or machine context to extract credentials, Kerberos tickets, or access tokens, supporting lateral movement, impersonation, and privilege escalation downstream. The service-context filter raises confidence above curiosity-driven mimikatz.exe execution by an interactive user."
references:
  - "https://attack.mitre.org/techniques/T1003/"
groupingFields:
  - "device.hostname"
groupingDurationSeconds: 3600
query: |-
  @CrowdStrike-Events
  | where process.cmd_line has_any (
      "sekurlsa::pth",
      "lsadump::dcsync",
      "lsadump::sam",
      "lsadump::secrets"
    )
  | where device.os.name contains "windows"
  | where process.integrity in ("System", "High", "Elevated")
  | where actor.user.name endswith "$"
     or actor.user.name in ("SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE")
